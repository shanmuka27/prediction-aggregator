name: collect

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python store.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}